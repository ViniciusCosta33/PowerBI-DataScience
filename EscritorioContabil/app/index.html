<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mesa de Tarefas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><span class="small muted">Escritório contábil</span><h1>Mesa de Tarefas</h1></div>
    <div class="session" id="session" hidden>
      <span id="who-top" class="small"></span>
      <button class="btn" id="btn-refresh" type="button">Atualizar</button>
      <button class="btn" id="btn-logout" type="button">Sair</button>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- LOGIN -->
  <section id="login" class="auth" hidden>
    <h2 id="auth-title">Entrar</h2>
    <p class="muted small" id="auth-sub">Use o e-mail cadastrado pelo gestor do escritório.</p>
    <form id="auth-form" class="stack">
      <label>E-mail <input id="auth-email" type="email" autocomplete="username" required></label>
      <label id="pw-wrap">Senha <input id="auth-pw" type="password" autocomplete="current-password" minlength="8" required></label>
      <button class="btn primary" id="auth-submit" type="submit">Entrar</button>
    </form>
    <div class="auth-links">
      <button class="btn link" id="mode-signup" type="button">Primeiro acesso: criar minha senha</button>
      <button class="btn link" id="mode-reset" type="button">Esqueci minha senha</button>
      <button class="btn link" id="mode-login" type="button" hidden>Voltar para entrar</button>
    </div>
    <p id="auth-msg" class="msg" role="status"></p>
  </section>

  <!-- NOVA SENHA (link de recuperação) -->
  <section id="newpw" class="auth" hidden>
    <h2>Definir nova senha</h2>
    <form id="newpw-form" class="stack">
      <label>Nova senha (mínimo 8 caracteres) <input id="newpw-input" type="password" autocomplete="new-password" minlength="8" required></label>
      <button class="btn primary" type="submit">Salvar senha</button>
    </form>
    <p id="newpw-msg" class="msg" role="status"></p>
  </section>

  <!-- APP -->
  <div id="app" hidden></div>
</main>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
