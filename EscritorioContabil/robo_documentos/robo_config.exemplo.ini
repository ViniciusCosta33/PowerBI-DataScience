; Copie este arquivo para robo_config.ini e preencha.
; NUNCA envie o robo_config.ini por e-mail/WhatsApp: ele tem a chave do robô.

[geral]
; Pasta raiz do compartilhamento no computador central (prefira o caminho local,
; ex.: D:\Escritorio, em vez de letra de rede mapeada).
raiz = D:\Escritorio
; Onde as pessoas salvam os PDFs (dentro da raiz)
entrada = 00_ENTRADA
; Para onde vão os documentos que o robô não conseguiu identificar
a_conferir = 00_A_CONFERIR
; Subpasta de certidões dentro da pasta de cada cliente
subpasta_certidoes = 07_CERTIDOES
; Status da tarefa ao dar baixa: em_revisao (você confere) ou concluida
status_baixa = em_revisao

